name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]' -e packages/python
      - run: python -m ruff check .
      - run: python -m pytest
      - run: paperkit validate
      - run: paperkit build
      - uses: actions/upload-artifact@v7
        with:
          name: verified-artifacts
          path: artifacts/

  packages:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: verified-artifacts
          path: artifacts/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build --outdir package-dist/python packages/python
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: packages/javascript/package-lock.json
      - run: npm ci --prefix packages/javascript
      - run: npm test --prefix packages/javascript
      - run: mkdir -p package-dist/javascript
      - name: Pack npm distribution
        working-directory: packages/javascript
        run: npm pack --pack-destination "$GITHUB_WORKSPACE/package-dist/javascript"
      - uses: actions/upload-artifact@v7
        with:
          name: registry-packages
          path: package-dist/

  manuscript:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v8
        with:
          name: verified-artifacts
          path: artifacts/
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - run: paperkit build-paper
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript
          path: dist/paper.pdf

  site:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: verified-artifacts
          path: artifacts/
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run check --prefix site
      - run: npm run build --prefix site
      - run: npx --prefix site playwright install --with-deps chromium
      - run: npm run test:e2e --prefix site
      - uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: site/dist/
