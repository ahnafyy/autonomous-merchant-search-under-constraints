name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]' -e packages/python
      - run: paperkit build
      - run: paperkit validate --release
      - run: python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/

  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]' -e packages/python
      - run: paperkit build
      - run: paperkit validate --release
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/javascript/package-lock.json
      - run: npm install --global npm@latest
      - run: npm ci --prefix packages/javascript
      - run: npm test --prefix packages/javascript
      - run: npm publish --prefix packages/javascript --provenance --access public