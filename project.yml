project:
  title: "Autonomous Shopping Optimizer"
  subtitle: "Exact stopping decisions under time, token, API, and purchase-price limits"
  slug: "autonomous-merchant-search-under-constraints"
  abstract: >-
    Autonomous Shopping Optimizer is middleware for sequential merchant search under
    hard time, token, API-call, API-spend, and purchase-price limits. Its exact
    finite-horizon planner tracks remaining resources, chooses the next feasible
    merchant, and returns buy, continue, or reject without executing an LLM call or a
    purchase. Its Python permit ledger atomically reserves enforceable call limits,
    reconciles exact or censored usage, and reclaims known unused capacity. The current
    research asks whether joint UCP merchant selection and permit allocation improves a
    preregistered purchase outcome over fixed feasible baselines on frozen held-out
    panels while maintaining zero hard-budget violations.
  keywords:
    - "autonomous shopping"
    - "online search"
    - "optimal stopping"
    - "resource constraints"
    - "ephemeral offers"
