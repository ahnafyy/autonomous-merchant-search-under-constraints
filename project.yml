project:
  title: "When Should a Shopping Agent Stop Searching?"
  subtitle: "When is one more merchant inspection worth its cost?"
  slug: "autonomous-merchant-search-under-constraints"
  abstract: >-
    A shopping agent should search again only when the expected saving can repay the
    cost of another inspection. We turn that intuition into a costly-search decision
    rule with a retained incumbent offer, seller-specific price evidence, and a
    product-level held-out evaluation. Shopify Global Catalog seller decks provide
    competing offers inside an observed product graph, while UCP direct-merchant
    panels characterize the wider search surface an agent may expand into. Together,
    they make the value and cost of another search measurable rather than heuristic.
    Adaptive stopping is compared with costed search-all on held-out product and SKU
    clusters. On the UCP panel it reliably lowers total cost at every declared
    real-dollar workload, while a sensitivity analysis finds search-all favorable at
    zero cost and no reliable separation at two small positive costs. This shows why
    material search cost makes selective stopping valuable.
