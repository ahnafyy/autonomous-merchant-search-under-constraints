schema_version: 1
avenues:
  - id: "AVENUE-001"
    title: "Recall-aware Pandora search over incomplete seller graphs"
    status: selected
    mechanism: >-
      A shopping agent retains the best observed seller offer while choosing whether
      another seller inspection has enough expected option value to justify its cost.
      An aggregator exposes a covered seller graph, while direct merchant discovery
      may expose additional costly cards outside that graph.
    minimal_model: >-
      A finite Pandora-search episode with a retained best offer, single-currency
      seller cards, scalarized inspection costs, and an optional hard inspection
      budget. Stopping purchases the retained best offer.
    novelty_hypothesis: >-
      Recall-aware dynamic search may reduce normalized total acquisition cost versus
      fixed search depths or thresholds when the expected improvement from unopened
      seller cards exceeds their inspection cost.
    decisive_calculation: >-
      On frozen seller decks, fit the Pandora and fixed policies on disjoint
      calibration products and compare them on held-out products under a declared
      inspection-cost grid. Reject a positive advantage claim if the product-clustered
      interval includes zero.
    expected_value: >-
      The result would tell an agent whether to inspect another seller after an
      aggregator has revealed only part of the relevant product graph.
    rejection_reason: null
  - id: "AVENUE-002"
    title: "Distribution-free stopping guarantees for ephemeral offers"
    status: deferred
    mechanism: >-
      Random merchant order or policy randomization may permit nontrivial guarantees
      without assuming reusable price or availability distributions.
    minimal_model: >-
      Unit query costs, a finite horizon, scalar prices, arbitrary availability, and
      either adversarial or uniformly random merchant order.
    novelty_hypothesis: >-
      Existing secretary, prophet, and online-search results may not directly cover
      joint purchase failure and operational resource budgets. This distinction must
      be established against verified prior work.
    decisive_calculation: >-
      Construct adversarial traces and derive the smallest horizon at which every
      deterministic threshold policy has an unbounded price ratio or excessive
      purchase-failure probability.
    expected_value: >-
      The result would state when distribution-free optimization is possible and when
      stronger assumptions are unavoidable.
    rejection_reason: >-
      Deferred, not rejected. The collected corpus has a median of two merchants per
      episode, which is too short a horizon for adversarial-order results to be
      distinguishable from the trivial rule. Revisit if a corpus with longer
      cross-merchant overlap becomes available.
  - id: "AVENUE-003"
    title: "From landed price to multi-attribute merchant utility"
    status: deferred
    mechanism: >-
      Shipping, delivery, trust, returns, and condition can reverse merchant rankings
      that appear optimal under item price alone.
    minimal_model: >-
      Extend the selected exact-SKU landed-price benchmark with a declared utility function or
      a Pareto order over a small set of merchant attributes.
    novelty_hypothesis: >-
      The extension may show which landed-price stopping conclusions survive partial orders
      and heterogeneous shopper preferences; no novelty is assumed before review.
    decisive_calculation: >-
      Test whether two attributes already produce policy reversals not representable
      by a stable scalar landed-price transformation.
    expected_value: >-
      A calibrated negative result would justify keeping the first paper focused on
      exact-SKU landed price rather than an unnecessarily broad utility model.
    rejection_reason: >-
      Deferred, not rejected. Shipping and tax are not consistently observable in the
      collected snapshots, so landed price cannot be computed for most episodes and a
      multi-attribute extension would rest on imputed components.
  - id: "AVENUE-004"
    title: "Revalidation after recalled seller search"
    status: deferred
    mechanism: >-
      After retaining a seller offer, an agent may need to revalidate price or
      availability before purchase. The state must include the retained offer age and
      revalidation transition model.
    minimal_model: >-
      A finite merchant-search episode with a best retained offer, explicit free
      recall or paid revalidation actions, hard resource budgets, and stochastic
      price and availability transitions.
    novelty_hypothesis: >-
      The relative value of commit-or-continue stopping may reverse when retained
      offers are available, especially under high short-delay catalog survival. No
      empirical effect is assumed before a transition model and benchmark are built.
    decisive_calculation: >-
      Compare the current commit-or-continue policy with retained-best and
      revalidation policies on common frozen panels under declared transition
      scenarios. Reject the avenue if recall changes neither policy ordering nor the
      decision regions beyond the stated tolerance.
    expected_value: >-
      The extension would distinguish the current no-reservation decision rule from
      a deployable shopping agent that can return to or re-check a prior offer.
    rejection_reason: >-
      Deferred, not rejected. The short daily series establishes neither checkout
      persistence nor a stable price-and-availability transition law for
      revalidation.
