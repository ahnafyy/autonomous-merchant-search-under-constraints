schema_version: 1
claims:
  - id: "SHOPIFY-SELLER-DECK-STUDY-001"
    statement: >-
      A frozen Shopify Global Catalog snapshot contains replayable, single-currency
      same-title seller decks with at least three distinct Shopify shop domains.
    status: "numerical"
    scope: >-
      The recovered complete 39-query prefix of the September 18--19, 2026 deep Shopify
      Global Catalog collection, USD offers, and the post-collection exact-normalized-
      model-title identity rule. Seller domains are not verified independent companies,
      and the snapshot is not a population sample.
    evaluator: "paperkit.evaluators:evaluate_shopify_deck_study"
    evidence:
      - "data/ucp/global-catalog-study-2026-09-18-deep.json"
      - "scripts/collect_global_catalog.py"
      - "scripts/analyze_global_catalog.py"
    manuscript_labels:
      - "sec:benchmark"
    site_visible: true
    limitations:
      - "Title matching was revised after collection and is therefore exploratory."
      - "Catalog offers do not establish checkout price or seller independence."
      - "The study reports a fixed snapshot and is not a population sample."

  - id: "UCP-OBSERVATION-QUALITY-001"
    statement: >-
      The direct-merchant UCP panel series detects and excludes common-mode retrieval
      discontinuities instead of treating them as merchant-offer disappearance.
    status: "numerical"
    scope: >-
      The September 2026 direct-merchant panel collection and its deterministic
      lifecycle-quality analysis. It measures catalog observability, not checkout
      persistence, seller coverage, or the recalled Pandora policy outcome.
    evaluator: "paperkit.evaluators:evaluate_ucp_panel_quality"
    evidence:
      - "data/ucp/panel-observation-quality.json"
      - "scripts/analyze_panel_observations.py"
    manuscript_labels:
      - "sec:benchmark"
    site_visible: true
    limitations:
      - "Direct panel observations are not pooled with Shopify seller decks."
      - "The observed catalog surface is incomplete and protocol changes can affect retrieval."

  - id: "UCP-PANDORA-REPLAY-001"
    statement: >-
      Across every registered inspection-cost scenario, adaptive recalled search
      reliably improves held-out total cost over costed search-all on the frozen
      September 2026 direct-merchant UCP panel series.
    status: "numerical"
    scope: >-
      Same-SKU, USD seller decks with at least three observed UCP merchant domains
      from ten registered quality-included daily panel dates. All dates for a SKU stay
      together in either calibration or held-out evaluation. Search-all opens every
      card and pays every declared inspection cost; the result is not pooled with
      Shopify decks.
    evaluator: "paperkit.evaluators:evaluate_ucp_pandora_replay"
    evidence:
      - "data/ucp/panel-observations-2026-09-03.jsonl.gz"
      - "data/ucp/panel-observations-2026-09-15.jsonl.gz"
      - "packages/python/src/autonomous_shopping_optimizer/ucp_pandora.py"
    manuscript_labels:
      - "sec:results"
    site_visible: true
    limitations:
      - "Merchant domains are replay cards, not verified independent sellers or checkout offers."
      - "Inspection costs are declared rate-card scenarios, not observed UCP billing."
      - "Same-SKU decks establish catalog identity but not shipping, tax, or availability at checkout."

  - id: "UCP-MARKET-RATE-SENSITIVITY-001"
    statement: >-
      In the frozen September 2026 UCP recall-aware panel replay, adaptive search
      reliably improves held-out total cost at the current catalog-expansion market
      rate and at ten times that workload. Search-all reliably improves at zero cost,
      while one-hundredth and one-tenth of the workload are inconclusive.
    status: "numerical"
    scope: >-
      Same SKU-clustered UCP daily-panel replay as UCP-PANDORA-REPLAY-001. The five
      registered multipliers scale the complete catalog-expansion per-inspection cost
      while holding its dated September 2026 provider rates and workload composition
      fixed. It is a sensitivity result, not observed provider billing.
    evaluator: "paperkit.evaluators:evaluate_ucp_market_rate_sensitivity"
    evidence:
      - "research/hidden-card-analysis.json"
      - "research/cost-rate-card-2026-09.json"
      - "packages/python/src/autonomous_shopping_optimizer/hidden_card_study.py"
    manuscript_labels:
      - "sec:results"
    site_visible: true
    limitations:
      - "The multipliers are counterfactual cost sensitivity values, not observed billing."
      - "Merchant domains are replay cards, not verified independent sellers or checkout offers."
      - "The result is clustered by SKU and does not make dates independent evidence."

  - id: "PANDORA-ADVANTAGE-001"
    statement: >-
      In the frozen Shopify seller-deck replay, adaptive recalled search reliably
      improves held-out total cost over costed search-all in the registered
      long-horizon scenario, but not in the two lower-cost scenarios.
    status: "numerical"
    scope: >-
      Forty title-normalized product decks from one frozen Shopify collection, 24
      used for calibration and 16 held out, evaluated across three registered
      declared real-dollar inspection-cost scenarios. Search-all opens every card and
      pays every declared inspection cost. The post-collection identity revision
      limits external interpretation but does not alter the registered held-out calculation.
    evaluator: "paperkit.evaluators:evaluate_no_reliable_pandora_improvement"
    evidence:
      - "data/ucp/global-catalog-study-2026-09-18-deep.json"
      - "packages/python/src/autonomous_shopping_optimizer/hidden_card_study.py"
    manuscript_labels:
      - "sec:results"
    site_visible: true
    limitations:
      - "Seller-order permutations are repeated replays, not independent products."
      - "Only the complete 39-query prefix of 48 registered deep queries is analyzed."
      - "Inspection costs use declared provider rate cards and workloads, not observed Shopify billing."
