    confidence: high
    status: candidate
  - citation_key: "gilbert1966recognizing"
    title: "Recognizing the Maximum of a Sequence"
    url: "https://doi.org/10.1080/01621459.1966.10502008"
    verified_on: "2026-09-02"
    overlap: >-
      Extended treatment of the Cayley-Moser problem, the full-information sequential
