    confidence: high
    status: established
  - citation_key: "bearden2006secretary"
    title: "A New Secretary Problem with Rank-Based Selection and Cardinal Payoffs"
    url: "https://doi.org/10.1016/j.jmp.2005.11.003"
    verified_on: "2026-09-02"
    overlap: >-
      Establishes that under a cardinal payoff objective the optimal cutoff is not the
