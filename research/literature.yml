works:
  - citation_key: "elyaniv2001optimal"
    title: "Optimal Search and One-Way Trading Online Algorithms"
    url: "https://doi.org/10.1007/s00453-001-0003-0"
    verified_on: "2026-07-24"
    overlap: >-
      Sequential adversarial prices, irrevocable online acceptance, and no assumed
      price distribution.
    distinction: >-
      Uses known price bounds and required selection; does not jointly model
      availability, inspection-resource vectors, or no-purchase failure.
    confidence: high
    status: candidate
  - citation_key: "esfandiari2019online"
    title: "Online Pandora's Boxes and Bandits"
    url: "https://doi.org/10.1609/aaai.v33i01.33011885"
    verified_on: "2026-07-24"
    overlap: >-
      Online box presentation, inspection cost, irrevocable keep-or-pass decisions,
      and cardinality, matroid, and single-knapsack variants.
    distinction: >-
      Uses known value and cost distributions and stochastic reward benchmarks;
      independence details require full-text confirmation.
    confidence: medium
    status: candidate
  - citation_key: "amanatidis2026pandora"
    title: "Pandora's Box Problem Over Time"
    url: "https://doi.org/10.1007/978-3-032-08560-3_28"
    verified_on: "2026-07-24"
    overlap: >-
      Box-specific processing time, time-dependent costs and rewards, and value
      deterioration after inspection.
    distinction: >-
      Uses a stochastic Pandora model; recall and resource-budget semantics require
      full-text confirmation before making a definitive comparison.
    confidence: medium
    status: candidate
  - citation_key: "lorenzen1981optimal"
    title: "Optimal Stopping with Sampling Cost: The Secretary Problem"
    url: "https://doi.org/10.1214/aop/1176994519"
    verified_on: "2026-07-24"
    overlap: >-
      Random-order irrevocable stopping with a cumulative interview or query cost.
    distinction: >-
      Uses relative ranks and a single scalar sampling cost rather than availability,
      multiple hard resource budgets, and an explicit failure-risk constraint.
    confidence: high
    status: candidate
  - citation_key: "boodaghians2020pandora"
    title: "Pandora's Box Problem with Order Constraints"
    url: "https://doi.org/10.1145/3391403.3399501"
    verified_on: "2026-07-24"
    overlap: "Costly sequential inspection under precedence and order restrictions."
    distinction: >-
      Uses known stochastic alternatives and permits selecting the best opened
      alternative, unlike externally ordered ephemeral offers with no recall.
    confidence: high
    status: candidate
  - citation_key: "berger2024pandora"
    title: "Pandora's Problem with Deadlines"
    url: "https://doi.org/10.1609/aaai.v38i18.30015"
    verified_on: "2026-07-24"
    overlap: "Deadlines and costly sequential inspection."
    distinction: >-
      Uses known distributions and allows choice until a box-specific deadline; the
      objective is maximum inspected value minus inspection cost.
    confidence: high
    status: candidate
  - citation_key: "weitzman1979optimal"
    title: "Optimal Search for the Best Alternative"
    url: "https://doi.org/10.2307/1910412"
    verified_on: "2026-07-24"
    overlap: "Sequential inspection cost and reservation-value stopping rules."
    distinction: >-
      Assumes known independent distributions, adaptive inspection order, and recall
      of the best inspected alternative rather than ephemeral no-recall offers.
    confidence: high
    status: candidate
  - citation_key: "rothschild1974searching"
    title: "Searching for the Lowest Price When the Distribution of Prices Is Unknown"
    url: "https://doi.org/10.1086/260229"
    verified_on: "2026-07-24"
    overlap: "Sequential consumer price search when the price law is initially unknown."
    distinction: >-
      Learns an unknown but persistent distribution; recall details require full-text
      confirmation and differ from a nonstationary trace with no reusable law.
    confidence: medium
    status: candidate
  - citation_key: "esfandiari2017prophet"
    title: "Prophet Secretary"
    url: "https://doi.org/10.1137/15M1029394"
    verified_on: "2026-07-24"
    overlap: "Random arrival, sequential revelation, and one irrevocable selection."
    distinction: >-
      Assumes uniformly random order and known independent nonidentical distributions,
      with no inspection cost, availability, resource budget, or failure constraint.
    confidence: high
    status: candidate
  - citation_key: "kesselheim2014primal"
    title: "Primal Beats Dual on Online Packing LPs in the Random-Order Model"
    url: "https://doi.org/10.1145/2591796.2591810"
    verified_on: "2026-07-24"
    overlap: "Irrevocable online decisions under multiple hard resource capacities."
    distinction: >-
      Studies random-order packing rather than stopping after one purchase, and has no
      inspection cost or terminal purchase-failure event.
    confidence: high
    status: candidate
  - citation_key: "gilbert1966recognizing"
    title: "Recognizing the Maximum of a Sequence"
    url: "https://doi.org/10.1080/01621459.1966.10502008"
    verified_on: "2026-09-02"
    overlap: >-
      Extended treatment of the Cayley-Moser problem, the full-information sequential
      selection recursion that our reservation-price sequence reproduces.
    distinction: >-
      Maximizes expected value of a single selection without resource budgets; our use
      is the price-minimization relabeling with a budget-derived horizon.
    confidence: high
    status: established
  - citation_key: "ferguson1989secretary"
    title: "Who Solved the Secretary Problem?"
    url: "https://doi.org/10.1214/ss/1177012493"
    verified_on: "2026-09-02"
    overlap: >-
      Historical account attributing the full-information problem to Cayley (1875) and
      distinguishing it from the rank-only secretary problem.
    distinction: >-
      A survey rather than a model; establishes attribution for the recursion we use.
    confidence: high
    status: established
  - citation_key: "finch2024quadratic"
    title: "A Deceptively Simple Quadratic Recurrence"
    url: "https://doi.org/10.48550/arXiv.2409.03510"
    verified_on: "2026-09-02"
    overlap: >-
      Asymptotic analysis of the same quadratic recurrence, giving the leading term
      that matches our observed decay of the acceptance fraction.
    distinction: >-
      Pure asymptotics with no decision or resource model attached.
    confidence: high
    status: established
  - citation_key: "entwistle2022asymptotics"
    title: "On Asymptotics of Optimal Stopping Times"
    url: "https://doi.org/10.3390/math10020194"
    verified_on: "2026-09-02"
    overlap: >-
      Records the same asymptotic rate for the uniform full-information stopping
      sequence.
    distinction: "Asymptotic regime only; our horizons are short and finite."
    confidence: medium
    status: candidate
  - citation_key: "katriel2025cayley"
    title: "The Cayley-Moser Problem with Poissonian Arrival of Offers"
    url: "https://doi.org/10.48550/arXiv.2511.02763"
    verified_on: "2026-09-02"
    overlap: >-
      States the standard discrete Cayley-Moser recursion that our sequence reproduces,
      and derives a continuous-time analogue of the same decay rate.
    distinction: >-
      Replaces the finite horizon with Poissonian arrivals; no resource budget or
      purchase-failure penalty.
    confidence: high
    status: established
  - citation_key: "bearden2006secretary"
    title: "A New Secretary Problem with Rank-Based Selection and Cardinal Payoffs"
    url: "https://doi.org/10.1016/j.jmp.2005.11.003"
    verified_on: "2026-09-02"
    overlap: >-
      Establishes that under a cardinal payoff objective the optimal cutoff is not the
      classical n/e, which is the mismatch our secretary comparison quantifies.
    distinction: >-
      Retains rank-only information, whereas our agent observes prices directly; it
      states the mismatch qualitatively rather than measuring a price penalty.
    confidence: high
    status: established
  - citation_key: "palley2014sequential"
    title: "Sequential Search and Learning from Rank Feedback: Theory and Experimental Evidence"
    url: "https://doi.org/10.1287/mnsc.2014.1902"
    verified_on: "2026-09-02"
    overlap: >-
      Contrasts full-information sequential search with rank-only search, the same
      information distinction that separates our threshold rule from the secretary rule.
    distinction: >-
      Studies human search behaviour experimentally, without resource budgets or an
      autonomous agent setting.
    confidence: high
    status: established
  - citation_key: "lippman1976job"
    title: "The Economics of Job Search: A Survey"
    url: "https://doi.org/10.1111/j.1465-7295.1976.tb00386.x"
    verified_on: "2026-09-02"
    overlap: >-
      Standard reference for reservation values that decline as a finite horizon is
      consumed, the qualitative behaviour our threshold shows.
    distinction: >-
      Job-search framing without multi-resource budgets or enforceable per-call limits.
    confidence: high
    status: candidate
  - citation_key: "kohn1974theory"
    title: "The Theory of Search"
    url: "https://doi.org/10.1016/0022-0531(74)90061-1"
    verified_on: "2026-09-02"
    overlap: "Reservation-price characterisation of optimal sequential search."
    distinction: >-
      Infinite-horizon and stationary; our horizon is finite and set by the budget.
    confidence: high
    status: candidate
  - citation_key: "cavallo2018scraped"
    title: "Scraped Data and Sticky Prices"
    url: "https://doi.org/10.1162/rest_a_00652"
    verified_on: "2026-09-03"
    overlap: >-
      Canonical measurement of online price-change durations, using daily scraped data
      from 181 retailers in 31 countries. Directly bears on whether offers are
      ephemeral at short horizons.
    distinction: >-
      Measures how often prices CHANGE and finds them sticky. It does not measure how
      often an offer DISAPPEARS, which is the hazard our benchmark depends on. This is
      the most likely citation a referee would raise against short-horizon ephemerality,
      so we cite it ourselves.
    confidence: high
    status: established
  - citation_key: "gorodnichenko2018jeea"
    title: "Price Setting in Online Markets: Does IT Click?"
    url: "https://doi.org/10.1093/jeea/jvx050"
    verified_on: "2026-09-03"
    overlap: >-
      Finds online prices change more often than offline yet still show relatively long
      spells of fixed prices.
    distinction: "Price rigidity only; silent on availability or delisting."
    confidence: high
    status: established
  - citation_key: "cavallo2017online"
    title: "Are Online and Offline Prices Similar? Evidence from Large Multi-channel Retailers"
    url: "https://doi.org/10.1257/aer.20160542"
    verified_on: "2026-09-03"
    overlap: >-
      Price levels are identical about 72 percent of the time across channels, with
      similar change frequencies and sizes.
    distinction: >-
      Cross-channel comparison rather than a within-seller availability hazard.
    confidence: high
    status: established
  - citation_key: "gorodnichenko2017basic"
    title: >-
      Price Setting in Online Markets: Basic Facts, International Comparisons, and
      Cross-Border Integration
    url: "https://doi.org/10.1257/aer.20141127"
    verified_on: "2026-09-03"
    overlap: >-
      Online prices are more flexible than offline, with pass-through of 60 to 75
      percent and half-life under two months.
    distinction: >-
      Establishes that the relevant timescale for price movement is months, not the
      minutes an agent search occupies.
    confidence: high
    status: established
  - citation_key: "cavallo2016billion"
    title: "The Billion Prices Project: Using Online Prices for Measurement and Research"
    url: "https://doi.org/10.1257/jep.30.2.151"
    verified_on: "2026-09-03"
    overlap: >-
      Describes the standard methodology for scraped online price panels, collecting
      about five million prices daily.
    distinction: >-
      Confirms that the field's finest sampling resolution is daily, so sub-daily offer
      dynamics are unmeasured rather than measured and absent.
    confidence: high
    status: established
  - citation_key: "delossantos2012testing"
    title: >-
      Testing Models of Consumer Search Using Data on Web Browsing and Purchasing
      Behavior
    url: "https://doi.org/10.1257/aer.102.6.2955"
    verified_on: "2026-09-03"
    overlap: >-
      Tests sequential search against fixed sample size using observed browsing, and
      argues explicitly from recall patterns.
    distinction: >-
      Rejects sequential search with recall in favour of fixed sample size, not in
      favour of no-recall sequential search. Our fixed-depth arm is the fixed-sample-size
      analogue, and this work is why that arm must be reported rather than omitted.
    confidence: high
    status: established
  - citation_key: "bronnenberg2016zooming"
    title: "Zooming In on Choice: How Do Consumers Search for Cameras Online?"
    url: "https://econpapers.repec.org/RePEc:inm:ormksc:v:35:y:2016:i:5:p:693-712"
    verified_on: "2026-09-03"
    overlap: >-
      Measures actual search breadth: consumers make about fourteen searches before
      purchase, with the chosen alternative usually discovered late in the sequence.
    distinction: >-
      Reports a count of searches rather than elapsed time, so it cannot be used to
      claim a median time to purchase. Human rather than agent search.
    confidence: medium
    status: candidate
  - citation_key: "chen2016algorithmic"
    title: "An Empirical Analysis of Algorithmic Pricing on Amazon Marketplace"
    url: "https://doi.org/10.1145/2872427.2883089"
    verified_on: "2026-09-03"
    overlap: >-
      Establishes that third-party algorithmic repricers are widely deployed, which is
      a mechanism by which offers could move faster than survey data suggests.
    distinction: >-
      Demonstrates the mechanism, not a measured sub-daily churn rate. We did not obtain
      its crawl cadence, so no figure from it is quoted.
    confidence: medium
    status: candidate
  - citation_key: "jing2011stockouts"
    title: "Stockouts in Online Retailing"
    url: "https://doi.org/10.1509/jmkr.48.2.342"
    verified_on: "2026-09-03"
    overlap: >-
      Studies how stockouts and fulfilment rates affect online purchase behaviour.
    distinction: >-
      Measures the consequences of stockouts for demand, not the hazard rate at which
      listings become unavailable. No published rate exists below month scale, which is
      the gap our daily panel probe addresses.
    confidence: high
    status: established
  - citation_key: "ucp2026catalog"
    title: "Universal Commerce Protocol: Shopping Catalog Capability"
    url: "https://ucp.dev/latest/specification/shopping/catalog/"
    verified_on: "2026-09-03"
    overlap: >-
      Normative statement that catalog responses are not transactional commitments and
      should not be reused across sessions without re-validation.
    distinction: >-
      This is the specification our benchmark queries, so it grounds the no-recall
      assumption by construction rather than by observed churn.
    confidence: high
    status: established
  - citation_key: "ucp2026checkout"
    title: "Universal Commerce Protocol: Shopping Checkout Capability"
    url: "https://ucp.dev/latest/specification/shopping/checkout/"
    verified_on: "2026-09-03"
    overlap: >-
      Defines an expires_at field on a checkout session with a default time to live of
      six hours, and error codes for out_of_stock and item_unavailable.
    distinction: >-
      Bounds how long a quoted price may be relied upon, which sets the natural episode
      horizon independently of any drift measurement.
    confidence: high
    status: established
  - citation_key: "ap22026checkout"
    title: "Agent Payments Protocol: Checkout Mandate"
    url: "https://ap2-protocol.org/ap2/checkout_mandate/"
    verified_on: "2026-09-03"
    overlap: >-
      Signed checkout mandates carry issued-at and expiry timestamps; the normative
      example uses a one hour validity window.
    distinction: >-
      A payment-authorisation protocol rather than a search model, but it independently
      confirms that quoted commerce terms are treated as expiring.
    confidence: high
    status: established
