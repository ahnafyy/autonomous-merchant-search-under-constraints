    confidence: high
    status: established
  - citation_key: "palley2014sequential"
    title: "Sequential Search and Learning from Rank Feedback: Theory and Experimental Evidence"
    url: "https://doi.org/10.1287/mnsc.2014.1902"
    verified_on: "2026-09-02"
    overlap: >-
      Contrasts full-information sequential search with rank-only search, the same
