      Job-search framing without multi-resource budgets or enforceable per-call limits.
    confidence: high
    status: candidate
  - citation_key: "kohn1974theory"
    title: "The Theory of Search"
    url: "https://doi.org/10.1016/0022-0531(74)90061-1"
    verified_on: "2026-09-02"
    overlap: "Reservation-price characterisation of optimal sequential search."
    distinction: >-
