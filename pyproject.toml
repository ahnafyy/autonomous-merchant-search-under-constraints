[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-paper-package-template"
version = "0.1.0"
description = "A template for publishing a research paper and matching software packages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
paperkit = "paperkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperkit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
